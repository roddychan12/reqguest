# Builds an unsigned iOS .ipa on a GitHub macOS runner.
# Install it with Sideloadly or AltStore, which sign it with your Apple ID.
# Run it from the repo's Actions tab → "iOS IPA (unsigned)" → Run workflow.
name: iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS app (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ReqGuest.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ReqGuest-ipa
          path: ReqGuest.ipa
          retention-days: 7
